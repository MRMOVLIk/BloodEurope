<style>
:root{--bg:#1b1230;--panel:#2b1e4a;--ink:#fff5e0;--accent:#f08a3c;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1d2f5a;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;display:flex;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:#1d2f5a;touch-action:pan-x pan-y}
#map::-webkit-scrollbar{display:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#stack{position:relative;display:inline-block;vertical-align:top;line-height:0;margin:auto;flex:none}
#labs{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;line-height:1.1}
.cl{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;font-weight:700}
.cl b,.cl i{display:block;font-style:normal;text-shadow:-1px -1px 0 #0e081e,1px -1px 0 #0e081e,-1px 1px 0 #0e081e,1px 1px 0 #0e081e,0 0 4px #0e081e}
.cl i{color:#cfe8ff}
.ct{position:absolute;left:0;top:0}
.ct s{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:block;text-decoration:none}
.ct s.dot{border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 2px #0e081e}
.ct s.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ct u{position:absolute;top:0;transform:translateY(-50%);white-space:nowrap;font-weight:700;text-decoration:none;text-shadow:-1px -1px 0 #0e081e,1px -1px 0 #0e081e,-1px 1px 0 #0e081e,1px 1px 0 #0e081e,0 0 4px #0e081e}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;border:0}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(6px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) 14px calc(8px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:5px;pointer-events:none;background:linear-gradient(rgba(27,18,48,.92),rgba(27,18,48,0))}
#hud .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#hud button,#hud #gold{pointer-events:auto}
#gold{flex:1;min-width:120px;font-size:12px;line-height:1.5;text-shadow:0 1px 2px #000}
#hud button{padding:6px 8px;font-size:12px;background:rgba(74,47,107,.92)}
#zoomctl{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:6px}
#zoomctl button{width:38px;height:38px;padding:0;font-size:16px;background:rgba(74,47,107,.92)}
#lb{display:none;position:fixed;left:calc(8px + env(safe-area-inset-left,0px));top:calc(78px + env(safe-area-inset-top,0px));z-index:11;max-width:230px;background:rgba(43,30,74,.95);border:3px solid #4a2f6b;padding:8px;font-size:12px;line-height:1.8}
#log{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:9;font-size:12px;line-height:1.7;pointer-events:none;text-shadow:0 1px 2px #000;max-height:6.8em;overflow:hidden;background:rgba(27,18,48,.6);padding:3px 7px;border-radius:4px;width:fit-content;max-width:calc(100vw - 16px)}
#log:empty{display:none}
#dopen{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:12;padding:10px 16px;font-size:12px;background:rgba(240,138,60,.95);color:#1b1230;border-color:#ffb070}
#drawer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(43,30,74,.97);border-top:4px solid #4a2f6b;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));max-height:58vh;overflow-y:auto;transform:translateY(110%);transition:transform .22s ease;font-size:12px;line-height:1.8}
#drawer.open{transform:translateY(0)}
#dclose{position:absolute;top:6px;right:8px;padding:4px 9px;font-size:13px}
#stats{padding-right:34px}
#acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#msg{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(27,18,48,.92);font-size:12px;line-height:1.8;padding:16px;overflow-y:auto}
#msg h1{font-size:14px;margin:0;color:var(--accent)}
#msg p{margin:0}
#msg button{padding:6px 2px;color:#1b1230;font-size:11px}
#pick{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:640px;max-height:62%;overflow-y:auto}
#msg #again,#msg #tomenu{padding:10px 14px;font-size:13px}
#menu{position:fixed;inset:0;z-index:50;background:#0a0c10;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:16px}
.mbox{width:100%;max-width:380px;text-align:center}
.mbox h1{font-size:22px;color:var(--accent);margin:0 0 8px}
.mbox .sub{font-size:12px;opacity:.8;margin:0 0 18px;line-height:1.8}
#mview button{display:block;width:100%;margin:10px 0;padding:14px 8px;font-size:11px}
#mview p{font-size:12px;line-height:2;text-align:left;margin:6px 0}
#mview .big{background:var(--accent);color:var(--bg);border-color:#ffb070}
button{font:inherit;color:var(--ink);background:#4a2f6b;border:3px solid #6a4a8b;border-radius:0;padding:8px 4px;font-size:12px;line-height:1.5}
button:active{background:var(--accent);color:var(--bg)}
button.off{opacity:.45}
button.on{background:#3a7a4a;border-color:#5fcf6f}
button.sp{background:var(--accent)!important;color:var(--bg)}
@media (orientation:landscape){
 #drawer{left:auto;top:0;width:min(360px,46vw);max-height:none;border-top:0;border-left:4px solid #4a2f6b;padding-top:calc(56px + env(safe-area-inset-top,0px));transform:translateX(110%)}
 #drawer.open{transform:translateX(0)}
 #dopen{left:auto;transform:none;right:calc(56px + env(safe-area-inset-right,0px))}
 #log{right:auto;max-width:48vw}
 #pick{grid-template-columns:repeat(4,1fr)}
}
.mbox h1,#msg h1{font-family:'Press Start 2P',system-ui,sans-serif;letter-spacing:1px;line-height:1.4}
#hud button{font-size:13px;min-width:34px}
#gold{font-size:13px}
</style>

 case'peace':tone(660,t,.25,'sine',.08);tone(495,t+.2,.45,'sine',.08);break;
 case'missile':tone(1400,t,.7,'sawtooth',.045,sfxG,110);noise(t+.7,.8,.35,700);tone(90,t+.7,.6,'sine',.2,sfxG,40);break;
